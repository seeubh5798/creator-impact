# Local stack: Postgres + API + worker + web.  `docker compose up --build`
# Then open http://localhost:3000 and click "Try the demo account".
# Port already taken?  WEB_PORT=3001 API_PORT=8001 docker compose up
# Optional keys (Instagram, Razorpay, Anthropic) are read from a `.env` file next to
# this file; copy .env.docker.example to .env to set them.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: impact
    ports: ["54329:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20

  migrate:
    build: { context: ., dockerfile: backend/Dockerfile }
    command: python -m scripts.migrate
    environment: &backend_env
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/impact
      FRONTEND_URL: http://localhost:3000
      DEMO_MODE: "true"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID:-}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RAZORPAY_PLAN_PRO_MONTHLY: ${RAZORPAY_PLAN_PRO_MONTHLY:-}
      RAZORPAY_PLAN_PRO_YEARLY: ${RAZORPAY_PLAN_PRO_YEARLY:-}
      RAZORPAY_PLAN_PRO_PLUS_MONTHLY: ${RAZORPAY_PLAN_PRO_PLUS_MONTHLY:-}
      RAZORPAY_PLAN_PRO_PLUS_YEARLY: ${RAZORPAY_PLAN_PRO_PLUS_YEARLY:-}
    depends_on:
      db: { condition: service_healthy }

  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment: *backend_env
    ports: ["${API_PORT:-8000}:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    build: { context: ., dockerfile: backend/Dockerfile }
    command: python -m app.worker
    environment: *backend_env
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build:
      context: frontend
      args: { BACKEND_URL: http://api:8000 }
    environment:
      BACKEND_URL: http://api:8000
      NEXT_PUBLIC_APP_NAME: Proofluence
      NEXT_PUBLIC_SITE_URL: http://localhost:${WEB_PORT:-3000}
    ports: ["${WEB_PORT:-3000}:3000"]
    depends_on: [api]

volumes:
  pgdata:
