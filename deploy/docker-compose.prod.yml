# Server stack (dev and prod boxes are identical): API + worker + Caddy (automatic HTTPS).
# Postgres lives in Supabase, so there is no database container here.
#
# Lives at /opt/proofluence/docker-compose.yml on the server; the deploy
# workflow copies it there on every release. Config comes from /opt/proofluence/.env
# (templates: deploy/env.dev.example, deploy/env.prod.example).

services:
  api:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    env_file: .env
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: &logging
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  worker:
    image: ${BACKEND_IMAGE}
    command: python -m app.worker
    restart: unless-stopped
    env_file: .env
    logging: *logging

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: { condition: service_healthy }
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
