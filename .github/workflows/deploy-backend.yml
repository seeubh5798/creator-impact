# Backend release pipeline, two environments:
#   push to main  -> dev         (api-dev.proofluence.com)
#   push to prod  -> production  (api.proofluence.com)
#
# Each run: test -> build image (GHCR) -> deploy to that environment's EC2 box
# (copy compose files, run DB migrations, roll API + worker, health check).
#
# Secrets live in GitHub *Environments* (Settings -> Environments), not the repo:
#   environment "dev":         EC2_HOST, EC2_USER, EC2_SSH_KEY
#   environment "production":  EC2_HOST, EC2_USER, EC2_SSH_KEY   (+ required reviewer)
# App config (.env) never leaves the server: /opt/proofluence/.env

name: Deploy backend

on:
  push:
    branches: [main, prod]
    paths: ["backend/**", "supabase/**", "deploy/**", ".github/workflows/deploy-backend.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-backend-${{ github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/proofluence-backend
  APP_DIR: /opt/proofluence
  TARGET: ${{ github.ref_name == 'prod' && 'production' || 'dev' }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: impact_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/impact_test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: ref
        run: echo "image=${IMAGE}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ env.TARGET }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'prod' && 'production' || 'dev' }}
    permissions: { contents: read, packages: read }
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets are configured
        env:
          HOST: ${{ secrets.EC2_HOST }}
          KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if [ -z "$HOST" ] || [ -z "$KEY" ]; then
            echo "::error::EC2_HOST / EC2_SSH_KEY are not set for the '${TARGET}' environment. See docs/AWS_SETUP.md step 7."
            exit 1
          fi
      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Copy compose files
        run: |
          scp -i ~/.ssh/deploy_key deploy/docker-compose.prod.yml \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${APP_DIR}/docker-compose.yml"
          scp -i ~/.ssh/deploy_key deploy/Caddyfile \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${APP_DIR}/Caddyfile"
      - name: Migrate and roll out
        env:
          IMAGE_REF: ${{ needs.build.outputs.image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "APP_DIR='$APP_DIR' IMAGE_REF='$IMAGE_REF' GHCR_USER='$GHCR_USER' GHCR_TOKEN='$GHCR_TOKEN' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          test -f .env || { echo "$APP_DIR/.env is missing. See docs/AWS_SETUP.md step 6."; exit 1; }
          grep -q '^API_DOMAIN=.\+' .env || { echo "API_DOMAIN missing from .env"; exit 1; }

          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          export BACKEND_IMAGE="$IMAGE_REF"
          export API_DOMAIN="$(grep '^API_DOMAIN=' .env | cut -d= -f2-)"
          docker compose pull -q api

          echo "==> Running database migrations"
          docker compose run --rm --no-deps api python -m scripts.migrate

          echo "==> Rolling out $BACKEND_IMAGE"
          grep -v '^BACKEND_IMAGE=' .env > .env.tmp && echo "BACKEND_IMAGE=$BACKEND_IMAGE" >> .env.tmp && mv .env.tmp .env && chmod 600 .env
          docker compose up -d --remove-orphans
          docker image prune -f >/dev/null
          docker logout ghcr.io >/dev/null

          echo "==> Health check"
          for i in $(seq 1 20); do
            if docker compose exec -T api python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)" 2>/dev/null; then
              echo "API healthy"; docker compose ps; exit 0
            fi
            sleep 3
          done
          echo "API did not become healthy"; docker compose logs --tail=100 api; exit 1
          REMOTE
